<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>진로 나침반 | 우리 반 진로진학 자료실</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #fdecf0;
    --paper: #fbcad6;
    --ink: #1B2A41;
    --ink-soft: #4A5568;
    --gold: #B98430;
    --gold-deep: #8C6522;
    --steel: #3D5A75;
    --steel-bg: #E4EAF0;
    --sage: #5B7A6F;
    --sage-bg: #E5EDE9;
    --plum: #8B5E83;
    --plum-bg: #F0E5EE;
    --line: rgba(27,42,65,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Pretendard', -apple-system, sans-serif;
    line-height: 1.6;
    padding-bottom: 4rem;
  }
  h1,h2,h3{ font-family: 'Noto Serif KR', serif; font-weight: 600; }
  .hidden{ display:none !important; }

  /* 헤더 */
  header{
    max-width: 960px;
    margin: 0 auto;
    padding: 3.5rem 1.5rem 2.5rem;
    text-align: left;
  }
  .eyebrow-line{
    display:flex; align-items:center; gap:10px;
    color: var(--gold-deep);
    font-size: 0.95rem;
    margin-bottom: 1rem;
  }
  .eyebrow-line svg{ width:20px; height:20px; flex-shrink:0; }
  header h1{
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    line-height: 1.35;
    max-width: 14ch;
  }
  header p{
    margin-top: 1rem;
    color: var(--ink-soft);
    max-width: 60ch;
    font-size: 1.05rem;
  }

  /* 카테고리 필터 */
  .filter-bar{
    max-width: 960px;
    margin: 0 auto;
    padding: 0 1.5rem;
    display:flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    margin-bottom: 2rem;
  }
  .filter-btn{
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    padding: 0.5rem 1.1rem;
    border-radius: 999px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  .filter-btn:hover{ border-color: var(--ink); color: var(--ink); }
  .filter-btn.active{
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }

  /* 카드 그리드 */
  main{
    max-width: 960px;
    margin: 0 auto;
    padding: 0 1.5rem;
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1.1rem;
  }
  .card{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.4rem;
    display:flex;
    flex-direction:column;
    gap: 0.7rem;
    transition: border-color 0.15s ease;
    cursor: pointer;
  }
  .card:hover{ border-color: var(--ink); }
  .tag{
    display:inline-flex;
    align-self:flex-start;
    font-size: 0.78rem;
    padding: 0.25rem 0.7rem;
    border-radius: 999px;
    font-weight: 500;
  }
  .tag.steel{ background:var(--steel-bg); color:var(--steel); }
  .tag.sage{ background:var(--sage-bg); color:var(--sage); }
  .tag.plum{ background:var(--plum-bg); color:var(--plum); }
  .tag.gold{ background:#F3E7D2; color:var(--gold-deep); }
  .card h3{ font-size: 1.15rem; }
  .card p{ color: var(--ink-soft); font-size: 0.92rem; flex-grow:1; }
  .card a{
    color: var(--ink);
    font-size: 0.9rem;
    font-weight: 500;
    text-decoration: none;
    display:flex;
    align-items:center;
    gap: 5px;
  }
  .card a:hover{ color: var(--gold-deep); }
  .card a svg{ width:15px; height:15px; }

  /* 안내 섹션 */
  .notice{
    max-width: 960px;
    margin: 3rem auto 0;
    padding: 1.5rem;
    border-top: 1px solid var(--line);
  }
  .notice h2{ font-size: 1.2rem; margin-bottom: 0.6rem; }
  .notice p{ color: var(--ink-soft); font-size: 0.92rem; }
  .notice-list{ margin-top: 0.8rem; padding-left: 1.2rem; color: var(--ink-soft); font-size: 0.92rem; }
  .notice-list li{ margin-bottom: 0.3rem; }

  footer{
    max-width: 960px;
    margin: 2.5rem auto 0;
    padding: 0 1.5rem;
    color: var(--ink-soft);
    font-size: 0.85rem;
  }

  /* ===== 상세 페이지 ===== */
  .detail-wrap{
    max-width: 760px;
    margin: 0 auto;
    padding: 2rem 1.5rem 0;
  }
  .back-btn{
    display:inline-flex; align-items:center; gap:6px;
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 0.5rem 1rem;
    border-radius: 999px;
    font-size: 0.9rem;
    text-decoration: none;
  }
  .back-btn:hover{ border-color: var(--ink); }
  .back-btn svg{ width:16px; height:16px; }
  .detail-head{ margin: 1.8rem 0 1.5rem; }
  .detail-head h1{
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    line-height: 1.35;
    margin: 0.8rem 0;
  }
  .detail-head .lead{ color: var(--ink-soft); font-size: 1.05rem; }
  .section{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.4rem 1.5rem;
    margin-bottom: 1rem;
  }
  .section h2{ font-size: 1.1rem; margin-bottom: 0.8rem; }
  .section ul{ padding-left: 1.2rem; }
  .section li{ margin-bottom: 0.35rem; font-size: 0.97rem; }
  .steps{ list-style: none; padding-left: 0 !important; counter-reset: s; }
  .steps li{
    counter-increment: s;
    display:flex; gap: 0.8rem; align-items:flex-start;
    margin-bottom: 0.7rem;
  }
  .steps li::before{
    content: counter(s);
    flex-shrink:0;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--bg);
    font-size: 0.82rem;
    display:flex; align-items:center; justify-content:center;
    margin-top: 1px;
  }
  .official{
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin-top: 1.5rem;
    background: var(--ink);
    color: var(--bg);
    text-decoration: none;
    padding: 0.95rem 1.2rem;
    border-radius: 12px;
    font-weight: 600;
    font-size: 1rem;
  }
  .official:hover{ background: #2c4160; }
  .official svg{ width:17px; height:17px; }
  .official + .official{ margin-top: 0.6rem; }
  .official.off{
    background: transparent;
    border: 1px dashed var(--ink-soft);
    color: var(--ink-soft);
    font-weight: 500;
    font-size: 0.92rem;
  }
  .note{ margin-top: 0.7rem; text-align:center; color: var(--ink-soft); font-size: 0.82rem; }
</style>
</head>
<body>

<!-- ===== 메인 페이지 ===== -->
<div id="homeView">

<header>
  <div class="eyebrow-line">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2" /><path d="M15 9l-3.5 6-2.5-2.5L15 9z" fill="currentColor" stroke="none"/></svg>
    <span>학급 진로진학부</span>
  </div>
  <h1>내 진로를 찾아가는 나침반</h1>
  <p>학과·자격증·진로검사·진학상담까지, 우리 반 진로진학부가 모은 자료들을 한곳에서 확인하세요.</p>
</header>

<div class="filter-bar" id="filterBar">
  <button class="filter-btn active" data-filter="all">전체</button>
  <button class="filter-btn" data-filter="major">학과·전공</button>
  <button class="filter-btn" data-filter="license">자격증·시험</button>
  <button class="filter-btn" data-filter="test">성적</button>
  <button class="filter-btn" data-filter="counsel">진학상담</button>
</div>

<main>
  <div class="grid" id="cardGrid"></div>

  <div class="notice">
    <h2>이용 안내</h2>
    <p>자료는 진로진학부가 주기적으로 새 정보로 업데이트해요.</p>
    <ul class="notice-list">
      <li>링크가 작동하지 않으면 진로진학부에게 알려주세요.</li>
      <li>추가하고 싶은 자료가 있다면 언제든 건의해주세요.</li>
    </ul>
  </div>
</main>

<footer>
  담당: 학급 진로진학부 · 문의는 학급 단체 채팅방으로 남겨주세요.
</footer>

</div>

<!-- ===== 상세 페이지 ===== -->
<div id="detailView" class="hidden">
  <div class="detail-wrap" id="detailBody"></div>
</div>

<script>

               { name: '사이트 이름', url: 'https://주소' },

/* =============== 아래는 사이트가 움직이는 코드예요 (건드리지 않아도 돼요) =============== */
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M7 7h10v10"/></svg>';
const BACK  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>';

const homeView = document.getElementById('homeView');
const detailView = document.getElementById('detailView');
const detailBody = document.getElementById('detailBody');
const grid = document.getElementById('cardGrid');
const buttons = document.querySelectorAll('.filter-btn');
let currentFilter = 'all';

function renderCards(){
  grid.innerHTML = SITES
    .filter(s => currentFilter === 'all' || s.cat === currentFilter)
    .map(s => `
    <div class="card" data-id="${s.id}">
      <span class="tag ${s.color}">${s.tag}</span>
      <h3>${s.title}</h3>
      <p>${s.summary}</p>
      <a href="#/${s.id}">자세히 보기 ${ARROW}</a>
    </div>`).join('');
}

function renderDetail(s){
  const list = arr => arr.map(x => `<li>${x}</li>`).join('');
  const links = (s.links && s.links.length)
    ? s.links.filter(l => l && l.url)
    : (s.url ? [{ name: s.btn || '공식 사이트 바로가기', url: s.url }] : []);
  const official = links.length
    ? links.map(l => `<a class="official" href="${l.url}" target="_blank" rel="noopener">${l.name || '바로가기'} ${ARROW}</a>`).join('')
      + `<p class="note">새 탭에서 열려요</p>`
    : `<div class="official off">${s.soon || '공식 사이트 링크는 곧 추가될 예정이에요.'}</div>`;
  detailBody.innerHTML = `
    <a class="back-btn" href="#/">${BACK} 목록으로</a>
    <div class="detail-head">
      <span class="tag ${s.color}">${s.tag}</span>
      <h1>${s.title}</h1>
      <p class="lead">${s.lead}</p>
    </div>
    <div class="section"><h2>이런 때 쓰면 좋아요</h2><ul>${list(s.when)}</ul></div>
    <div class="section"><h2>이용 방법</h2><ul class="steps">${list(s.steps)}</ul></div>
    <div class="section"><h2>진로진학부 꿀팁</h2><ul>${list(s.tips)}</ul></div>
    ${official}`;
}

function route(){
  const id = location.hash.replace('#/', '');
  const site = SITES.find(s => s.id === id);
  if(site){
    renderDetail(site);
    homeView.classList.add('hidden');
    detailView.classList.remove('hidden');
    document.title = site.title + ' | 진로 나침반';
  } else {
    detailView.classList.add('hidden');
    homeView.classList.remove('hidden');
    document.title = '진로 나침반 | 우리 반 진로진학 자료실';
  }
  window.scrollTo(0, 0);
}

buttons.forEach(btn => {
  btn.addEventListener('click', () => {
    buttons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderCards();
  });
});

grid.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if(card) location.hash = '#/' + card.dataset.id;
});

window.addEventListener('hashchange', route);
renderCards();
route();
</script>
